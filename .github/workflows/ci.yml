on: [push, pull_request]
name: CI
jobs:
  test:
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
    
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          # Modern macOS requires LC_UUID, generated by Go 1.24 and newer.
          # Keep Linux on the go.mod toolchain to check baseline compatibility.
          go-version: ${{ runner.os == 'macOS' && 'stable' || '' }}
          go-version-file: 'go.mod'

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
